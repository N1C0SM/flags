<ion-header>
  <ion-toolbar>
    <ion-title>Mi Carrito</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h2>Productos del carrito</h2>

  <ion-list>
    @for (producto of productos(); track producto.id) {
      <ion-item>
        <ion-label>
          <h2>{{ producto.nombre }}</h2>
          <p>{{ producto.precio }} €</p>
        </ion-label>

        <ion-button
          color="danger"
          (click)="eliminarProducto(producto.id)">
          Eliminar
        </ion-button>
      </ion-item>
    }
  </ion-list>

  <h2>
    Precio total:
    <ion-badge color="success">
      {{ precioTotal() }} €
    </ion-badge>
  </h2>

  <ion-button
    expand="block"
    (click)="agregarProductoAleatorio()">
    Agregar producto aleatorio
  </ion-button>
  <ion-button
    expand="block"
    (click)="eliminarTodosLosProductos()">
    Eliminar el carrito
  </ion-button>


</ion-content>
